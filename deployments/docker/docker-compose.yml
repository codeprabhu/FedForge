services:

  postgres:
    image: postgres:17

    container_name: fedforge-postgres

    environment:
      POSTGRES_DB: fedforge
      POSTGRES_USER: fedforge
      POSTGRES_PASSWORD: fedforge

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fedforge -d fedforge"]
      interval: 2s
      timeout: 3s
      retries: 15

  coordinator:
    build:
      context: ../../coordinator
      dockerfile: Dockerfile

    container_name: fedforge-coordinator

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      DATABASE_URL: postgresql://fedforge:fedforge@postgres:5432/fedforge

    ports:
      - "8000:8000"

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 15

  worker:
    build:
      context: ../../worker
      dockerfile: Dockerfile

    depends_on:
      coordinator:
        condition: service_healthy

    environment:
      COORDINATOR_URL: http://coordinator:8000
      HIGGS_MAX_ROWS: "0"

volumes:
  postgres_data:
